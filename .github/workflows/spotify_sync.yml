name: Sync Spotify Liked Songs

on:
  schedule:
    - cron: '0 7 * * *' 
  workflow_dispatch: 

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      actions: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install spotipy

      - name: Debug secrets
        run: |
          echo "CLIENT_ID length: ${#SPOTIPY_CLIENT_ID}"
          echo "CLIENT_SECRET length: ${#SPOTIPY_CLIENT_SECRET}"
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}

      - name: Run sync script
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
        run: |
          # Recreate the cache from secrets
          cat << 'EOF' > .cache
          ${{ secrets.SPOTIPY_CACHE }}
          EOF
          
          python run.py
          
      - name: Save updated Spotify cache back to Secrets
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }} 
        run: |
          # Update the secret with the newly refreshed .cache file
          cat .cache | gh secret set SPOTIPY_CACHE
